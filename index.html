<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nabla Wallpaper</title>
<meta name="description" content="Project Nabla 메인샷 월페이퍼 다운로드와 방명록 · 홍익대학교 산업디자인전공 2026 졸업전시">
<meta property="og:title" content="Nabla Wallpaper">
<meta property="og:description" content="Fine-Tuning System for Personalized Physical AI — 월페이퍼 받고 방명록 남기기">
<meta property="og:image" content="wallpaper/Nabla_Wallpaper_1440x2880.jpg">
<meta name="theme-color" content="#fdfdff">
<link rel="icon" href="assets/nabla-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Figma: 산디 졸전 / node 4318:1213 (390 기준 모바일 한 열) */
:root{
  --gray-1:#f6f8ff;        /* Gray_1  페이지 배경 */
  --frosty:#fdfdff;        /* Frosty_White 상단 바 */
  --white:#ffffff;         /* Pure_White 입력칸 */
  --dark-1:#1d2231;        /* Dark_1 텍스트 */
  --gray-2:#ebeef8;        /* Gray_2 입력칸 테두리 */
  --gray-3:#e1e4f1;        /* Gray_3 카드 테두리 */
  --card:#f7f8fc;
  --accent:#3b5ad9;        /* Accent_Blue 선택 상태 */
  --cta:#4f5df0;           /* 버튼 */
  --ink-85:rgba(29,34,49,.85);
  --ink-80:rgba(29,34,49,.80);
  --ink-75:rgba(29,34,49,.75);
  --ink-65:rgba(29,34,49,.65);
  --ink-50:rgba(29,34,49,.50);
  --ink-35:rgba(29,34,49,.35);
  --ink-25:rgba(29,34,49,.25);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--gray-1);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--gray-1);color:var(--dark-1);font-family:var(--font);letter-spacing:-.025em;
  padding-bottom:env(safe-area-inset-bottom,0px)}
img{display:block;max-width:100%}
p{margin:0}

/* 상단 바 28px */
.topbar{position:sticky;top:0;z-index:10;background:var(--frosty);box-shadow:0 2px 4px rgba(0,0,0,.1);
  padding-top:env(safe-area-inset-top,0px)}
.topbar-in{height:28px;max-width:430px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-in img{width:40px;height:12px}
.topbar-in p{font-size:8px;font-weight:500;line-height:1;color:var(--ink-80);text-align:right;letter-spacing:-.025em;white-space:nowrap;margin-right:-4px}

.wrap{max-width:430px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* 메인샷 */
.shot{width:242px;height:484px;margin:16px auto 0;border-radius:12px;box-shadow:0 12px 24px rgba(0,0,67,.15);overflow:hidden;background:var(--white)}
.shot img{width:100%;height:100%;object-fit:cover;-webkit-touch-callout:default}
.credit{margin-top:12px;text-align:center;font-size:13px;line-height:1;color:var(--ink-85)}
.credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.credit a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* 파란 버튼 (월페이퍼 저장 / 남기기 공용) */
.cta{position:relative;display:flex;align-items:center;height:50px;border-radius:16px;background:var(--cta);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 4px 16px rgba(1,1,119,.2),inset 0 0 18px rgba(255,255,255,.55);
  color:#fff;text-decoration:none;font:inherit;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.cta:hover{filter:brightness(1.05)}
.cta:active{transform:scale(.985)}
.cta:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.dl{margin-top:20px;padding:0 17px 0 20px;gap:6px}
.dl img{width:19px;height:19px;flex:none}
.dl .label{font-size:17px;font-weight:600;line-height:1.2}
.dl .meta{margin-left:auto;font-size:10px;line-height:1.2;color:rgba(255,255,255,.65)}

.divider{height:0;border:0;border-top:1px solid var(--ink-35);margin:35px 0 0}

/* 방명록 */
.gb-head{margin-top:25px;display:flex;align-items:baseline;gap:8px}
.gb-head h2{margin:0;font-size:24px;font-weight:700;line-height:1.2}
.sub{font-size:12px;font-weight:400;line-height:1.2;color:var(--ink-65)}
.gb-lead{margin-top:12px;font-size:13px;line-height:1.2;color:var(--ink-85)}

.card{margin-top:20px;background:var(--card);border:1px solid var(--gray-3);border-radius:16px;padding:17px 15px 15px;display:grid;gap:0}
.field-head{display:flex;align-items:baseline;gap:6px;margin:0}
.field-head label,.field-head .vis-t{font-size:16px;font-weight:600;line-height:1.2;color:var(--dark-1);padding:0;float:none}
.input{display:block;width:100%;margin-top:8px;background:var(--white);border:1px solid var(--gray-2);border-radius:8px;
  font:inherit;font-size:16px;letter-spacing:-.025em;color:var(--dark-1);outline:none}
.input:focus{border-color:var(--accent)}
#gb-name{height:36px;padding:0 12px}
#gb-msg{height:206px;padding:10px 12px;resize:none;line-height:1.4}
.gap-20{margin-top:20px}
.count{margin-top:4px;text-align:right;font-size:12px;line-height:1.2;color:var(--ink-50);padding-right:4px;font-variant-numeric:tabular-nums}
.count.over{color:#c62a3f}

fieldset{border:0;margin:0;padding:0;min-width:0}
.vis{margin-top:11px}
.seg{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label{height:50px;border-radius:8px;background:var(--white);border:1px solid var(--gray-2);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
.seg .k{font-size:16px;font-weight:600;line-height:1.2;color:var(--ink-35)}
.seg .e{font-size:12px;line-height:1.2;color:var(--ink-25)}
.seg input:checked + label{border-color:var(--accent);box-shadow:0 4px 8px rgba(1,1,119,.15)}
.seg input:checked + label .k{color:var(--dark-1)}
.seg input:checked + label .e{color:var(--ink-65)}
.seg input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}

.send{margin-top:34px;width:100%;flex-direction:column;justify-content:center;padding:0}
.send .label{font-size:17px;font-weight:600;line-height:1.2}
.send .meta{font-size:10px;line-height:1.2;color:rgba(255,255,255,.65);margin-top:-2px}
.send[disabled]{opacity:.55;cursor:default}
.status{margin-top:10px;font-size:12px;line-height:1.3;min-height:1.3em;text-align:center;color:var(--ink-65)}
.status.err{color:#c62a3f}
.status.ok{color:var(--accent)}
[hidden]{display:none!important}
.status:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* 공개 글 목록 */
.entries{list-style:none;margin:55px 0 0;padding:0;display:grid;gap:24px}
.entry{display:grid;gap:4px;min-width:0}
.entry .who{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.entry .name{font-size:16px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.entry time{font-size:12px;line-height:1.2;color:var(--ink-50);font-variant-numeric:tabular-nums}
.entry .msg{font-size:16px;line-height:1.2;color:var(--ink-75);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{margin-top:55px;font-size:13px;line-height:1.2;color:var(--ink-65)}
.more{display:block;margin:32px auto 0;background:none;border:1px solid var(--gray-3);border-radius:999px;padding:8px 18px;
  font:inherit;font-size:13px;color:var(--dark-1);cursor:pointer}
.end{height:80px}
@media (prefers-reduced-motion:reduce){.cta{transition:none}.cta:active{transform:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <img src="assets/nabla-logo.svg" width="40" height="12" alt="Nabla">
    <p>Fine-Tuning System for Personalized Physical AI</p>
  </div>
</header>

<main class="wrap">
  <div class="shot">
    <img src="wallpaper/Nabla_Wallpaper_1440x2880.jpg" width="1440" height="2880"
         alt="Project Nabla 메인샷. 흰 펜싱복을 입은 사람과 청보라빛 사족보행 로봇이 나란히 서 있다.">
  </div>
  <p class="credit">Designed by. <a href="https://www.instagram.com/design_identificati0n/" target="_blank" rel="noopener">@design_identificati0n</a></p>

  <a class="cta dl" href="wallpaper/Nabla_Wallpaper_1440x2880.jpg" download="Nabla_Wallpaper_1440x2880.jpg">
    <img src="assets/icon-download.svg" width="19" height="19" alt="">
    <span class="label">월페이퍼 저장하기</span>
    <span class="meta">1440 × 2880 px</span>
  </a>

  <hr class="divider">

  <section aria-labelledby="gb-title">
    <div class="gb-head"><h2 id="gb-title">방명록 남기기</h2><span class="sub">Guestbook</span></div>
    <p class="gb-lead">전시를 관람한 뒤 자유롭게 작성해주세요.<br>공개 글은 아래에 보이고, 비공개 글은 표시되지 않습니다.</p>

    <form class="card" id="gb-form" novalidate>
      <div class="field-head"><label for="gb-name">작성자 이름</label><span class="sub">Visitor’s name</span></div>
      <input class="input" id="gb-name" name="name" maxlength="30" autocomplete="nickname" required>

      <div class="field-head gap-20"><label for="gb-msg">내용</label><span class="sub">Comment</span></div>
      <textarea class="input" id="gb-msg" name="message" maxlength="1000" required></textarea>
      <div class="count" id="gb-count">0 / 1000</div>

      <fieldset class="vis" aria-labelledby="gb-vis-title">
        <div class="field-head"><span class="vis-t" id="gb-vis-title">공개 여부</span><span class="sub">Visibility</span></div>
        <div class="seg">
          <input type="radio" id="gb-vis-public" name="visibility" value="public" checked>
          <label for="gb-vis-public"><span class="k">공개</span><span class="e">Visible</span></label>
          <input type="radio" id="gb-vis-private" name="visibility" value="private">
          <label for="gb-vis-private"><span class="k">비공개</span><span class="e">Invisible</span></label>
        </div>
      </fieldset>

      <div class="hp" aria-hidden="true"><label for="gb-site">웹사이트</label><input id="gb-site" name="site" tabindex="-1" autocomplete="off"></div>
      <button class="cta send" id="gb-send" type="submit"><span class="label" id="gb-send-label">남기기</span><span class="meta">Leave a comment</span></button>
      <p class="status" id="gb-status" role="status" aria-live="polite"></p>
    </form>

    <ol class="entries" id="gb-list" aria-label="공개 방명록"></ol>
    <p class="empty" id="gb-empty">아직 남겨진 글이 없어요. 첫 글을 남겨 주세요.</p>
    <button class="more" id="gb-more" type="button" hidden>이전 글 더 보기</button>
  </section>
  <div class="end"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  "use strict";
  var PAGE = 30;
  var $ = function(id){ return document.getElementById(id); };
  var form=$("gb-form"), nameEl=$("gb-name"), msgEl=$("gb-msg"), countEl=$("gb-count"),
      sendEl=$("gb-send"), sendLabel=$("gb-send-label"), statusEl=$("gb-status"),
      listEl=$("gb-list"), emptyEl=$("gb-empty"), moreEl=$("gb-more");

  // 작성 일시: 서버(created_at) 값을 한국 시간으로 표시
  var fmt = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});

  function setStatus(text, kind){ statusEl.textContent=text; statusEl.className="status"+(kind?" "+kind:""); }
  function updateCount(){
    var n = msgEl.value.length;
    countEl.textContent = n+" / 1000";
    countEl.classList.toggle("over", n>1000);
  }
  msgEl.addEventListener("input", function(){ updateCount(); setStatus(""); });
  nameEl.addEventListener("input", function(){ setStatus(""); });

  var cfg = window.NABLA_CONFIG || {};
  var ready = cfg.supabaseUrl && cfg.supabaseKey && cfg.supabaseUrl.indexOf("YOUR-")<0 && window.supabase;
  if(!ready){
    sendEl.disabled = true;
    setStatus("방명록 연결 준비 중이에요. 잠시 후 다시 들러 주세요.", "err");
    emptyEl.hidden = true;
    return;
  }
  var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:false}});
  var oldest = null;

  function render(rows, append){
    if(!append) listEl.textContent = "";
    rows.forEach(function(r){
      var li=document.createElement("li"); li.className="entry";
      var who=document.createElement("div"); who.className="who";
      var n=document.createElement("span"); n.className="name"; n.textContent=r.name;
      var t=document.createElement("time"); t.dateTime=r.created_at; t.textContent=fmt.format(new Date(r.created_at));
      var p=document.createElement("p"); p.className="msg"; p.textContent=r.message;
      who.appendChild(n); who.appendChild(t); li.appendChild(who); li.appendChild(p);
      listEl.appendChild(li);
    });
    emptyEl.hidden = listEl.children.length>0;
  }

  function load(append){
    var q = sb.from("guestbook").select("name,created_at,message").order("created_at",{ascending:false}).limit(PAGE);
    if(append && oldest) q = q.lt("created_at", oldest);
    return q.then(function(res){
      if(res.error){ emptyEl.hidden=false; emptyEl.textContent="방명록을 불러오지 못했어요. 새로고침해 주세요."; return; }
      var rows=res.data||[];
      if(rows.length) oldest = rows[rows.length-1].created_at;
      render(rows, append);
      moreEl.hidden = rows.length<PAGE;
    });
  }
  moreEl.addEventListener("click", function(){ load(true); });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name=nameEl.value.trim(), message=msgEl.value.trim(), isPublic=$("gb-vis-public").checked;
    if($("gb-site").value) return; // 봇 차단용 숨은 필드
    if(!name){ setStatus("이름을 입력해 주세요.","err"); nameEl.focus(); return; }
    if(!message){ setStatus("내용을 입력해 주세요.","err"); msgEl.focus(); return; }
    if(message.length>1000){ setStatus("내용은 1000자까지 쓸 수 있어요. 지금 "+message.length+"자예요.","err"); msgEl.focus(); return; }
    sendEl.disabled=true; sendLabel.textContent="남기는 중…";
    sb.from("guestbook").insert({name:name, message:message, is_public:isPublic}).then(function(res){
      sendEl.disabled=false; sendLabel.textContent="남기기";
      if(res.error){ setStatus("저장하지 못했어요. 연결을 확인하고 다시 눌러 주세요.","err"); return; }
      msgEl.value=""; updateCount();
      if(isPublic){ setStatus("남겼어요. 고맙습니다.","ok"); oldest=null; load(false); }
      else { setStatus("비공개로 남겼어요. 이종현 님에게만 전해져요.","ok"); }
    });
  });

  load(false);
})();
</script>
</body>
</html>
